<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login — Legend Games Command Center</title>
  <meta name="description" content="Secure administrative command center access for Legend Games inventory, orders, and operations.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/shared.css">
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../db/supabase.js"></script>
</head>
<body class="admin-login-body">
  <div class="cyber-grid-overlay"></div>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-badge">RESTRICTED TERMINAL</div>
        <div class="brand-logo-wrap">
          <span class="brand-accent">LEGEND</span> GAMES
        </div>
        <p class="brand-subtitle">Master Operations & Inventory Command Center</p>
      </div>

      <div class="login-tabs">
        <button class="login-tab-btn active" id="tab-passcode-btn" type="button" onclick="switchLoginMode('passcode')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Quick PIN
        </button>
        <button class="login-tab-btn" id="tab-supabase-btn" type="button" onclick="switchLoginMode('supabase')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Supabase Auth
        </button>
      </div>

      <!-- Quick Passcode Form -->
      <form id="passcode-form" class="login-form active" onsubmit="handlePasscodeLogin(event)">
        <div class="form-group">
          <label class="form-label" for="admin-pin">Admin Security Passcode</label>
          <div class="input-with-icon">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="admin-pin" class="form-input" placeholder="Enter admin passcode" autocomplete="current-password" required autofocus>
          </div>
          <p class="form-hint">Default shop manager code: <code>legend2026</code></p>
        </div>

        <div id="login-alert" class="login-alert" style="display: none;"></div>

        <button type="submit" id="btn-login-submit" class="btn-admin btn-admin-primary btn-block">
          <span>Authorize Access</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>

      <!-- Supabase Auth Form -->
      <form id="supabase-form" class="login-form" onsubmit="handleSupabaseLogin(event)" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="supabase-email">Staff Email</label>
          <div class="input-with-icon">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" id="supabase-email" class="form-input" placeholder="admin@legendgames.ng">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="supabase-password">Password</label>
          <div class="input-with-icon">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="supabase-password" class="form-input" placeholder="••••••••">
          </div>
        </div>

        <div id="supabase-alert" class="login-alert" style="display: none;"></div>

        <button type="submit" id="btn-supabase-submit" class="btn-admin btn-admin-primary btn-block">
          <span>Authenticate with Supabase</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>

      <div class="login-footer">
        <a href="../home/home.html" class="back-store-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Return to Storefront
        </a>
        <span class="security-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/></svg>
          End-to-End Encrypted Terminal
        </span>
      </div>
    </div>
  </div>

  <script>
    // Check if already authenticated
    if (sessionStorage.getItem('legend_admin_auth') === 'true' || localStorage.getItem('legend_admin_auth') === 'true') {
      window.location.href = 'index.html';
    }

    function switchLoginMode(mode) {
      const passcodeTab = document.getElementById('tab-passcode-btn');
      const supabaseTab = document.getElementById('tab-supabase-btn');
      const passcodeForm = document.getElementById('passcode-form');
      const supabaseForm = document.getElementById('supabase-form');

      if (mode === 'passcode') {
        passcodeTab.classList.add('active');
        supabaseTab.classList.remove('active');
        passcodeForm.style.display = 'block';
        supabaseForm.style.display = 'none';
        document.getElementById('admin-pin').focus();
      } else {
        supabaseTab.classList.add('active');
        passcodeTab.classList.remove('active');
        passcodeForm.style.display = 'none';
        supabaseForm.style.display = 'block';
        document.getElementById('supabase-email').focus();
      }
    }

    function showAlert(id, msg, isError = true) {
      const alertEl = document.getElementById(id);
      if (!alertEl) return;
      alertEl.textContent = msg;
      alertEl.className = 'login-alert ' + (isError ? 'error' : 'success');
      alertEl.style.display = 'block';
    }

    function handlePasscodeLogin(e) {
      e.preventDefault();
      const pinInput = document.getElementById('admin-pin');
      const val = pinInput.value.trim();

      // Master passkey for shop managers: legend2026 or 8080
      if (val === 'legend2026' || val === '8080' || val === 'naijaplay') {
        sessionStorage.setItem('legend_admin_auth', 'true');
        sessionStorage.setItem('legend_admin_user', 'Shop Admin');
        sessionStorage.setItem('legend_admin_role', 'Operations Director');
        showAlert('login-alert', 'Access Granted. Initializing Command Center...', false);
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 400);
      } else {
        showAlert('login-alert', 'Invalid admin security passcode. Please try again.');
        pinInput.classList.add('input-error');
        setTimeout(() => pinInput.classList.remove('input-error'), 800);
      }
    }

    async function handleSupabaseLogin(e) {
      e.preventDefault();
      const email = document.getElementById('supabase-email').value.trim();
      const password = document.getElementById('supabase-password').value;
      const btn = document.getElementById('btn-supabase-submit');

      btn.disabled = true;
      btn.innerHTML = '<span>Verifying...</span>';

      try {
        const client = window.LegendSupabase ? LegendSupabase.getClient() : null;
        if (!client) {
          throw new Error('Supabase client unavailable. Please use the Quick PIN method.');
        }

        const { data, error } = await client.auth.signInWithPassword({ email, password });
        if (error) throw error;

        sessionStorage.setItem('legend_admin_auth', 'true');
        sessionStorage.setItem('legend_admin_user', data.user.email);
        sessionStorage.setItem('legend_admin_role', 'Supabase Admin');
        showAlert('supabase-alert', 'Authenticated. Redirecting...', false);
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 400);
      } catch (err) {
        showAlert('supabase-alert', err.message || 'Supabase authentication failed.');
        btn.disabled = false;
        btn.innerHTML = `<span>Authenticate with Supabase</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
      }
    }
  </script>
</body>
</html>
