<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=/home/home.html">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legend Games — Nigeria's Premier Gaming Vault &amp; Console Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Russo+One&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f1015;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .loader-brand {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin-bottom: 16px;
    }
    .loader-brand span {
      color: #00A8E8;
    }
    .loader-ring {
      width: 40px;
      height: 40px;
      border: 3px solid #232533;
      border-top-color: #00A8E8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 14px;
    }
    .loader-text {
      font-size: 0.82rem;
      color: #8b8f9e;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    // Instant redirect to home
    if (window.location.pathname === '/' || window.location.pathname === '/index.html') {
      window.location.replace('home/home.html');
    }
  </script>
</head>
<body>
  <div class="loader-brand"><span>LEGEND</span> GAMES</div>
  <div class="loader-ring"></div>
  <div class="loader-text">Initializing Gaming Vault...</div>
</body>
</html>
