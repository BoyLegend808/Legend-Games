<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Games &amp; Laptop Installations — Legend Games Lagos</title>
  <meta name="description" content="Browse PC game installation price list for gaming laptops and desktop PCs in Lagos. Full offline installations, high speed direct transfers.">

  <link rel="stylesheet" href="../shared/shared.css">
  <link rel="stylesheet" href="pc-games.css">
</head>
<body>

  <main class="main-content">
    <div class="site-container">

      <!-- Trust Bar -->
      <div class="trust-bar">
        <span class="trust-item">
          <span class="trust-dot"></span> In-Shop PC Game Installs
        </span>
        <span class="trust-sep">·</span>
        <span class="trust-item">High Speed NVMe Transfer</span>
      </div>

      <div class="pc-header">
        <h2 class="section-heading" style="font-size:1.35rem; margin-bottom:4px;">PC Game Installations</h2>
        <p class="section-sub">Bring your laptop or external PC drive for rapid game installs in Lagos.</p>
      </div>

      <!-- Search Input -->
      <div class="search-bar-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" class="search-input" id="pc-search-input"
          placeholder="Search PC games (e.g. Cyberpunk, GTA V, FC26)..."
          oninput="PCGamesCatalog.filterGames(this.value)">
      </div>

      <!-- PC Games List -->
      <div class="pc-games-list" id="pc-games-list">
        <!-- Rendered by JS -->
      </div>

    </div>
  </main>

  <!-- Script Imports -->
  <script src="../shared/data/consoles.js"></script>
  <script src="../shared/data/games.js"></script>
  <script src="../shared/data/accessories.js"></script>
  <script src="../shared/data/disks.js"></script>
  <script src="../shared/data/bundles.js"></script>
  <script src="../shared/data/wraps.js"></script>
  <script src="../shared/shared.js"></script>
  <script src="pc-games.js"></script>
</body>
</html>
