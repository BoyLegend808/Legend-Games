<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Terminal — Legend Games Lagos</title>
  <meta name="description" content="Restricted staff operations terminal for Legend Games.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2306070a'/><polygon points='30,20 80,50 30,80' fill='%23ccff00'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/shared.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="legend-storefront-body" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">
  
  <div class="site-container" style="max-width: 440px; width: 100%;">
    <div class="card card-elevated" style="padding: 36px 28px; text-align: center; border-color: rgba(204, 255, 0, 0.25); box-shadow: 0 16px 40px rgba(0,0,0,0.8), 0 0 30px rgba(204,255,0,0.08);">
      
      <!-- Brand Logo Matching Site -->
      <div style="display: inline-flex; align-items: center; gap: 10px; margin-bottom: 8px;">
        <div style="width: 36px; height: 36px; background: rgba(204,255,0,0.14); border: 1px solid #ccff00; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #ccff00;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </div>
        <div style="font-family: 'Russo One', sans-serif; font-size: 1.6rem; letter-spacing: 0.5px; color: #fff;">
          LEGEND<span style="color: #ccff00;">GAMES</span>
        </div>
      </div>

      <div style="display: inline-block; padding: 3px 10px; background: rgba(0, 229, 255, 0.12); border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 999px; color: #00e5ff; font-family: 'Chakra Petch'; font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 20px;">
        STAFF OPERATIONS TERMINAL
      </div>

      <p style="color: #a3b1c6; font-size: 0.85rem; margin-bottom: 24px; line-height: 1.45;">
        Enter your shop manager PIN code to manage inventory, catalog prices, and customer WhatsApp quotes.
      </p>

      <form id="passcode-form" onsubmit="handlePasscodeLogin(event)">
        <div class="form-group" style="text-align: left; margin-bottom: 16px;">
          <label class="form-label" for="admin-pin" style="font-size: 0.76rem; color: #7c889b; text-transform: uppercase; font-weight: 700;">Security PIN Code</label>
          <input type="password" id="admin-pin" class="form-input" placeholder="••••••••" autocomplete="current-password" required autofocus style="text-align: center; font-size: 1.2rem; letter-spacing: 4px; font-family: 'Chakra Petch';">
          <p class="form-hint" style="text-align: center; margin-top: 8px; font-size: 0.75rem; color: #7c889b;">
            Default passcode: <code>legend2026</code> or <code>8080</code>
          </p>
        </div>

        <div id="login-alert" class="login-alert" style="display: none; margin-bottom: 16px;"></div>

        <button type="submit" id="btn-login-submit" class="btn btn-primary btn-full" style="height: 48px; font-size: 0.95rem;">
          <span>Unlock Command Center</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>

      <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem;">
        <a href="../home/home.html" style="color: #00e5ff; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;">
          ← Back to Storefront
        </a>
        <span style="color: #556277;">Legend Games Lagos</span>
      </div>

    </div>
  </div>

  <script>
    if (sessionStorage.getItem('legend_admin_auth') === 'true' || localStorage.getItem('legend_admin_auth') === 'true') {
      window.location.href = 'index.html';
    }

    function showAlert(msg, isError = true) {
      const alertEl = document.getElementById('login-alert');
      if (!alertEl) return;
      alertEl.textContent = msg;
      alertEl.className = 'login-alert ' + (isError ? 'error' : 'success');
      alertEl.style.display = 'block';
    }

    function handlePasscodeLogin(e) {
      e.preventDefault();
      const pinInput = document.getElementById('admin-pin');
      const val = pinInput.value.trim();

      if (val === 'legend2026' || val === '8080' || val === 'naijaplay' || val === 'admin') {
        sessionStorage.setItem('legend_admin_auth', 'true');
        sessionStorage.setItem('legend_admin_user', 'Shop Manager');
        sessionStorage.setItem('legend_admin_role', 'Administrator');
        showAlert('Access Authorized! Loading Command Center...', false);
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 300);
      } else {
        showAlert('Invalid PIN code. Try legend2026 or 8080.');
        pinInput.classList.add('input-error');
        setTimeout(() => pinInput.classList.remove('input-error'), 800);
      }
    }
  </script>
</body>
</html>
